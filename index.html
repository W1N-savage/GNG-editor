
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNG Editor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 16px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #a78bfa;
  font-size: 32px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
  background: #202020;
  border-radius: 18px;
}

input {
  display: block;
  width: 100%;
  margin: 20px auto;
  color: white;
}

button {
  background: #a78bfa;
  color: #111;
  border: none;
  border-radius: 10px;
  padding: 13px 18px;
  margin: 6px;
  font-size: 15px;
  font-weight: bold;
}

button:disabled {
  opacity: .4;
}

canvas {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 20px auto;
  border-radius: 10px;
}

p {
  color: #bbb;
}
</style>
</head>

<body>

<div class="container">
  <h1>GNG Editor</h1>
  <p>Your personal photo editor</p>

  <input type="file" id="upload" accept="image/*">

  <canvas id="canvas" hidden></canvas>

  <div>
    <button id="rotate" disabled>Rotate ↻</button>
    <button id="save" disabled>Save Photo</button>
  </div>

  <p id="status">Upload a photo to begin.</p>
</div>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const rotateButton = document.getElementById("rotate");
const saveButton = document.getElementById("save");
const status = document.getElementById("status");

let originalImage = null;
let rotation = 0;

function drawImage() {
  const w = originalImage.naturalWidth;
  const h = originalImage.naturalHeight;

  const sideways = rotation % 180 !== 0;

  canvas.width = sideways ? h : w;
  canvas.height = sideways ? w : h;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.drawImage(originalImage, -w / 2, -h / 2);
  ctx.restore();
}

upload.addEventListener("change", function() {
  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    status.textContent = "Please choose an image.";
    return;
  }

  const url = URL.createObjectURL(file);
  const image = new Image();

  image.onload = function() {
    originalImage = image;
    rotation = 0;

    canvas.hidden = false;
    rotateButton.disabled = false;
    saveButton.disabled = false;

    drawImage();
    status.textContent = "Photo loaded successfully!";

    URL.revokeObjectURL(url);
  };

  image.onerror = function() {
    status.textContent = "Couldn't load that photo.";
    URL.revokeObjectURL(url);
  };

  image.src = url;
});

rotateButton.addEventListener("click", function() {
  if (!originalImage) return;

  rotation = (rotation + 90) % 360;
  drawImage();
});

saveButton.addEventListener("click", function() {
  if (!originalImage) return;

  canvas.toBlob(function(blob) {
    if (!blob) {
      status.textContent = "Couldn't save the photo.";
      return;
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "GNG-edited-photo.png";
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    status.textContent = "Your photo is ready!";
  }, "image/png");
});
</script>

</body>
</html>
