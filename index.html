
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GNG Editor</title>
<style>
body {
  background: #10101c;
  color: white;
  font-family: Arial, sans-serif;
  padding: 25px;
  text-align: center;
}
h1 { color: #8b7cff; }
textarea {
  width: 100%;
  height: 150px;
  background: #202033;
  color: white;
  border: 1px solid #7667ff;
  border-radius: 12px;
  padding: 12px;
  box-sizing: border-box;
  font-size: 16px;
}
button {
  background: #7667ff;
  color: white;
  border: none;
  padding: 14px 25px;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 16px;
}
#output {
  background: #202033;
  padding: 15px;
  margin-top: 20px;
  border-radius: 12px;
  min-height: 60px;
  white-space: pre-wrap;
}
</style>
</head>
<body>

<h1>🐬 GNG Editor</h1>
<p>Tell your AI what you want to create!</p>

<textarea id="prompt" placeholder="Tell the AI what to add..."></textarea>

<br>
<button onclick="generate()">Generate</button>

<div id="output">Your AI response will appear here.</div>

<script>
function generate() {
  const prompt = document.getElementById("prompt").value.trim();
  const output = document.getElementById("output");

  if (!prompt) {
    output.textContent = "Enter an instruction first!";
    return;
  }

  output.textContent = "Your instruction: " + prompt +
    "\n\nAI connection not configured yet.";
}
</script>

</body>
</html>
